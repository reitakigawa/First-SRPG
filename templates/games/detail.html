{% extends "base.html" %}

{% block title %}{{ game.title }}{% endblock %}

{% block content %}
  <p><a href="{{ url_for('games_index') }}">← ゲーム一覧へ</a></p>
  <h1>{{ game.title }}</h1>

  {% if game_url %}
    <p><a href="{{ game_url }}" target="_blank" rel="noopener">ゲームを開く</a></p>
  {% endif %}

  <pre style="white-space: pre-wrap">{{ game | tojson(indent=2) }}</pre>
{% endblock %}
