{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <p><a href="{{ url_for('blog_index') }}">← ブログ一覧へ</a></p>
  <h1>{{ post.title }}</h1>
  {% if post.date %}<p class="muted">公開日: {{ post.date }}</p>{% endif %}
  <hr />
  <article>
    <pre style="white-space: pre-wrap">{{ post.content }}</pre>
  </article>
{% endblock %}
