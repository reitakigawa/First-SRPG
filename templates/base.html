<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Personal Site{% endblock %}</title>
    <style>
      body {
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      header,
      footer {
        margin-bottom: 1.5rem;
      }
      nav a {
        margin-right: 0.75rem;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('novels_index') }}">Novels</a>
        <a href="{{ url_for('blog_index') }}">Blog</a>
        <a href="{{ url_for('gallery_index') }}">Gallery</a>
        <a href="{{ url_for('games_index') }}">Games</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      <p class="muted">Flask Personal Site</p>
    </footer>
  </body>
</html>
